assistant:
  name: стелла
  language: uk
modes:
  resource_mode: balanced
  cloud_mode: fallback
safety:
  confirm_dangerous_actions: true
  allow_shell_commands: true
llm:
  local_provider: ollama
  local_model: qwen2.5:3b
  cloud_provider: none
  ollama_base_url: http://127.0.0.1:11434
  timeout_seconds: 45
  keep_alive: '0'
  num_ctx: 2048
stt:
  provider: none
  mode: push_to_talk
tts:
  enabled: true
  provider: "piper"
  speak_llm_answers: true
  speak_command_results: false
  piper_model: "models/piper/uk_UA/ukrainian_tts/medium/uk_UA-ukrainian_tts-medium.onnx"
  output_player: "pw-play"