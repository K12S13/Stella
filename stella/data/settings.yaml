assistant:
  name: стелла
  language: uk
modes:
  resource_mode: balanced
  cloud_mode: fallback
safety:
  confirm_dangerous_actions: true
  allow_shell_commands: true
llm:
  local_provider: ollama
  local_model: qwen2.5:7b
  cloud_provider: none
  ollama_base_url: http://127.0.0.1:11434
  timeout_seconds: 45
  keep_alive: '0'
  num_ctx: 6144
  local_model_memory_gb: 16
  local_model_vram_gb: 8
  cpu_threads: 8
stt:
  provider: whisper
  mode: wake_word
  auto_submit: true
  vosk_model_path: models/vosk/uk-small
  whisper_model: large-v3-turbo
  whisper_device: cuda
  whisper_compute_type: int8_float16
  whisper_language: uk
  whisper_beam_size: 1
  whisper_vad_filter: false
  listen_seconds: 60
  sample_rate: 16000
  device_index: null
tts:
  enabled: true
  provider: piper
  fallback_provider: piper
  language_routing: true
  default_language: uk
  speak_llm_answers: true
  speak_command_results: false
  piper_model: models/piper/uk_UA/tetiana/high/uk_UA-tetiana-high.onnx
  output_player: mpv
  edge:
    uk_voice: uk-UA-PolinaNeural
    en_voice: en-US-JennyNeural
    ru_voice: ru-RU-SvetlanaNeural
    rate: +0%
    volume: +0%
    pitch: +0Hz
  uk:
    provider: edge
    model: models/piper/uk_UA/tetiana/high/uk_UA-tetiana-high.onnx
  en:
    provider: edge
    model: models/piper/en_US/amy/medium/en_US-amy-medium.onnx
  ru:
    provider: edge
    model: models/piper/ru_RU/irina/medium/ru_RU-irina-medium.onnx
wake:
  enabled: true
  provider: vosk
  words:
  - стелла
  strict_confirm: true
  allow_fuzzy: false
  trigger_max_words_before_wake: 0
  silence_seconds: 0.8
  min_command_seconds: 0.4
  max_command_seconds: 10
  energy_threshold: 250
  min_trigger_energy: 180
  cooldown_seconds: 1.5
  preroll_seconds: 4.0
